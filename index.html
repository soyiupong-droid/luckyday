    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background: #f0f2f5; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 篩選區塊 */
        .filter-section { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filter-title { font-weight: bold; margin: 15px 0 5px; color: #333; font-size: 0.95em; border-left: 4px solid #d32f2f; padding-left: 8px; }
        /* 第一個標題不需要上邊距 */
        .filter-title:first-of-type { margin-top: 0; }
        
        .filter-group-label { font-size: 0.8em; color: #888; margin-top: 5px; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
        
        button {
            padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px;
            transition: all 0.2s; flex-grow: 1; text-align: center;
        }
        button.active { background: #d32f2f; color: white; border-color: #d32f2f; font-weight: bold; box-shadow: 0 2px 4px rgba(211, 47, 47, 0.3); }
        .star-btn { flex-grow: 0; min-width: 30px; }

        /* 結果列表 */
        .result-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card { background: white; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ddd; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        .card.good { border-left-color: #e53935; } 
        .card.neutral { border-left-color: #fbc02d; }
        .card.bad { border-left-color: #424242; }

        .date-main { font-size: 1.1em; font-weight: bold; color: #000; display: flex; align-items: center; gap: 8px; }
        .week-tag { font-size: 0.75em; background: #eee; padding: 1px 5px; border-radius: 4px; font-weight: normal; color: #555; }
        .week-tag.red { color: #d32f2f; background: #ffebee; } /* 週六日變紅 */
        
        .lunar-row { font-size: 0.95em; color: #555; margin-top: 4px; }
        .info-row { font-size: 0.85em; color: #888; margin-top: 2px; }

        /* 標籤樣式 */
        .tags-area { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 0.85em; display: inline-block; white-space: nowrap;}
        .tag-officer { background: #eee; font-weight: bold; color: #333; }
        .tag-star { background: #e3f2fd; color: #1565c0; }
        
        /* 節氣與特殊日標籤 */
        .tag-term { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; font-weight: bold; }
        .tag-eve { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 0.8em; }

        .reset-btn { width: 100%; margin-top: 15px; padding: 10px; background: #455a64; color: white; border: none; font-size: 14px; border-radius: 6px; cursor: pointer;}
        .reset-btn:hover { background: #37474f; }
    </style>
</head>

    // ==========================================
    // 2. 設定選項
    // ==========================================
    const stems = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
    const branches = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
    const officers = ["建", "除", "滿", "平", "定", "執", "破", "危", "成", "收", "開", "閉"];
    
    // 28宿分類
    const starsEast = ["角", "亢", "氐", "房", "心", "尾", "箕"];
    const starsNorth = ["斗", "牛", "女", "虛", "危", "室", "壁"];
    const starsWest = ["奎", "婁", "胃", "昴", "畢", "觜", "参"];
    const starsSouth = ["井", "鬼", "柳", "星", "張", "翼", "軫"];

    // 狀態管理：多選
    let activeFilters = { 
        monthStem: [],   // 新增：月天干
        monthBranch: [], // 新增：月地支
        dayStem: [],     // 改名：日天干 (原 stem)
        dayBranch: [],   // 改名：日地支 (原 branch)
        officer: ["除", "滿", "定", "執", "危", "成", "開"], 
        star: ["室", "壁", "婁", "胃", "畢", "参", "井", "張", "軫", "角", "房", "尾", "箕", "斗"] 
    };

    function init() {
        // 建立月干支按鈕
        createButtons("month-stems", stems, "monthStem");
        createButtons("month-branches", branches, "monthBranch");

        // 建立日干支按鈕
        createButtons("day-stems", stems, "dayStem");
        createButtons("day-branches", branches, "dayBranch");

        // 建立其他按鈕
        createButtons("officers", officers, "officer");
        createButtons("stars-east", starsEast, "star", true);
        createButtons("stars-north", starsNorth, "star", true);
        createButtons("stars-west", starsWest, "star", true);
        createButtons("stars-south", starsSouth, "star", true);

        filterData();
    }

    function createButtons(elementId, items, filterType, isStar = false) {
        const container = document.getElementById(elementId);
        if (!container) return; // 安全檢查

        items.forEach(item => {
            const btn = document.createElement("button");
            btn.innerText = item;
            if(isStar) btn.classList.add("star-btn");
            if (activeFilters[filterType].includes(item)) {
                btn.classList.add("active");
            }
            btn.onclick = () => toggleFilter(btn, filterType, item);
            container.appendChild(btn);
        });
    }

    function toggleFilter(btn, type, value) {
        btn.classList.toggle("active");
        const index = activeFilters[type].indexOf(value);
        if (index > -1) activeFilters[type].splice(index, 1);
        else activeFilters[type].push(value);
        filterData();
    }

    function resetFilters() {
        activeFilters = { 
            monthStem: [], monthBranch: [], 
            dayStem: [], dayBranch: [], 
            officer: [], star: [] 
        };
        document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        filterData();
    }

    // 取得星期幾
    function getWeekDay(dateString) {
        const days = ["日", "一", "二", "三", "四", "五", "六"];
        const d = new Date(dateString);
        return days[d.getDay()];
    }

    function filterData() {
        const results = almanacData.filter(item => {
            // 篩選月天干 (檢查 item.month 是否包含該天干)
            const matchMonthStem = activeFilters.monthStem.length === 0 || activeFilters.monthStem.some(s => item.month.includes(s));
            
            // 篩選月地支 (檢查 item.month 是否包含該地支)
            const matchMonthBranch = activeFilters.monthBranch.length === 0 || activeFilters.monthBranch.some(b => item.month.includes(b));

            // 篩選日天干
            const matchDayStem = activeFilters.dayStem.length === 0 || activeFilters.dayStem.some(s => item.day.includes(s));
            
            // 篩選日地支
            const matchDayBranch = activeFilters.dayBranch.length === 0 || activeFilters.dayBranch.some(b => item.day.includes(b));
            
            // 篩選建星
            const matchOfficer = activeFilters.officer.length === 0 || activeFilters.officer.includes(item.officer);
            
            // 篩選星宿
            const matchStar = activeFilters.star.length === 0 || activeFilters.star.some(s => item.star.includes(s));

            return matchMonthStem && matchMonthBranch && matchDayStem && matchDayBranch && matchOfficer && matchStar;
        });
        renderResults(results);
    }

    function renderResults(data) {
        const container = document.getElementById("results");
        const countDiv = document.getElementById("count");
        container.innerHTML = "";
        countDiv.innerText = `符合條件： ${data.length} 筆資料`;

        if (data.length === 0) {
            container.innerHTML = "<div style='text-align:center; color:#999; padding:20px;'>沒有符合的日期</div>";
            return;
        }

        data.forEach((item) => {
            const weekDay = getWeekDay(item.date);
            const isWeekend = (weekDay === "六" || weekDay === "日");
            
            // 判斷吉凶顏色
            let statusClass = "bad";
            if (["建","滿","成","開"].includes(item.officer)) statusClass = "good";
            else if (["平","定"].includes(item.officer)) statusClass = "neutral";
            
            // 判斷節氣前一日
            let isTermEve = false;
            let nextTermName = "";
            
            const originalIndex = almanacData.indexOf(item);
            if (originalIndex !== -1 && originalIndex < almanacData.length - 1) {
                const nextDayItem = almanacData[originalIndex + 1];
                if (nextDayItem.term && nextDayItem.term !== "") {
                    isTermEve = true;
                    nextTermName = nextDayItem.term;
                }
            }

            // 組裝 HTML
            const card = document.createElement("div");
            card.className = `card ${statusClass}`;
            
            let tagsHtml = `
                <span class="tag tag-officer">${item.officer}</span>
                <span class="tag tag-star">${item.star}</span>
            `;
            if (item.term) {
                tagsHtml += `<br><span class="tag tag-term">★ ${item.term}</span>`;
            }
            if (isTermEve) {
                tagsHtml += `<br><span class="tag tag-eve">⚠️ ${nextTermName}前一日</span>`;
            }

            const lunarText = item.lunar ? `農曆：${item.lunar}` : "";

            card.innerHTML = `
                <div>
                    <div class="date-main">
                        ${item.date} 
                        <span class="week-tag ${isWeekend ? 'red' : ''}">週${weekDay}</span>
                    </div>
                    <div class="lunar-row">${lunarText}</div>
                    <div class="info-row">
                        月：${item.month} | 日：${item.day}
                    </div>
                </div>
                <div class="tags-area">
                    ${tagsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    init();
</script>
</body>
</html>
